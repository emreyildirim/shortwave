server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx sits behind Traefik, which terminates TLS, so nginx believes it is
    # serving plain HTTP. Any absolute redirect it builds would point at
    # http:// and turn every sitemap URL into an https->http->https chain.
    absolute_redirect off;

    # Every real route is a prerendered file on disk. Anything else is a
    # genuine 404 — not the console with an ad slot on it.
    #
    # `$uri/index.html` rather than `$uri/`: matching a directory makes nginx
    # 301 to the trailing-slash form, so /learn would redirect to /learn/ even
    # though the canonical tag and the sitemap both say /learn. Naming the
    # file directly serves it with a 200 and no redirect at all.
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # NOTE: do not add a `types { ... }` block here. In nginx a types block
    # inside server REPLACES the inherited MIME map rather than extending it,
    # which would serve .css and .js as the default type and break the page.
    # The base image already includes mime.types at the http level.
    location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /ads.txt    { add_header Cache-Control "public, max-age=3600"; }

    # Long-cache hashed assets, never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
