server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every real route is a prerendered file on disk. Anything else is a
    # genuine 404 — not the console with an ad slot on it.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # NOTE: do not add a `types { ... }` block here. In nginx a types block
    # inside server REPLACES the inherited MIME map rather than extending it,
    # which would serve .css and .js as the default type and break the page.
    # The base image already includes mime.types at the http level.
    location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /ads.txt    { add_header Cache-Control "public, max-age=3600"; }

    # Long-cache hashed assets, never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
